# No build step: Netlify serves the files as they are.
[build]
  publish = "."

# Always fetch the latest event data so new posts show straight away.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# The app's offline helper must always be checked for updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
